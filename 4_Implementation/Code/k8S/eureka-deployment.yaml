apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
      - name: eureka
        image: eureka-service:latest  # must match your local image
        imagePullPolicy: Never        # do not pull from Docker Hub
        ports:
        - containerPort: 8761
