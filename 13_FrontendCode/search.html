<!DOCTYPE html>
<html>
<head>
  <title>Search Appointment</title>
  <style>
    body { font-family: Arial; margin:0; background:#fafafa; }
    header { 
      background:#e75480; 
      padding:20px; 
      color:#fff; 
      text-align:center; 
      font-size:22px;
    }
    .container {
      width:320px; 
      margin:40px auto; 
      background:white; 
      padding:20px; 
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width:100%; 
      padding:10px; 
      margin:10px 0; 
      border-radius:6px; 
      border:1px solid #ccc;
      font-size:15px;
    }
    button {
      background:#e75480; 
      color:white; 
      border:none; 
      cursor:pointer;
    }
    button:hover {
      background:#d34472;
    }
  </style>
</head>
<body>

<header>Welcome to Beauty World</header>

<div class="container">
  <h3>Search Appointment</h3>
  <input type="text" placeholder="Enter your full name" required>
  <button onclick="window.location.href='list.html'">Search</button>
</div>

</body>
</html>
