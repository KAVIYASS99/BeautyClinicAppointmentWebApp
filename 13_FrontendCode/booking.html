<!DOCTYPE html>
<html>
<head>
  <title>Beauty World - Booking</title>
  <style>
    body { font-family: Arial; background:#fafafa; margin:0; padding:0; }
    header { background:#e75480; padding:20px; color:#fff; text-align:center; }
    .container { width:300px; margin:40px auto; }
    input, select, button {
      width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc;
    }
    button { background:#e75480; color:#fff; border:none; }
  </style>
</head>
<body>

<header>Welcome to Beauty World</header>

<div class="container">
  <h3>Book Appointment</h3>
  <form action="success.html">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <select required>
      <option value="">Select Service</option>
      <option>Facial</option>
      <option>Hair Styling</option>
      <option>Manicure</option>
      <option>Pedicure</option>
    </select>
    <input type="date" required>
    <input type="time" required>
    <button type="submit">Book Now</button>
  </form>
</div>

</body>
</html>
